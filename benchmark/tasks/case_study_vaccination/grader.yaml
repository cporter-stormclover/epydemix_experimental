checks:
  - {name: r0, type: config_equals, path: r0, expect: 2.5, rtol: 0.02}
  - {name: vaccine_efficacy, type: config_equals, path: parameters.vaccine_efficacy, expect: 0.8, rtol: 0.001}
  - {name: no_vaccination_attack_rate, type: metric_within, bundle: "outputs/no_vaccination.epx", metric: attack_rate.0.5, reference: "outputs/no_vaccination.epx", rtol: 0.05}
  - name: campaign_ranking
    type: ranking_preserved
    metric: attack_rate.0.5
    items: ["outputs/high.epx", "outputs/moderate.epx", "outputs/low.epx", "outputs/no_vaccination.epx"]
    order: ascending
  - {name: provenance, type: provenance_complete}
  - {name: assumptions, type: assumptions_declared}
  - {name: reports_ranking, type: report_mentions, pattern: "(?i)rank"}
